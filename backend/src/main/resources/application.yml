spring:
  application:
    name: nutrition-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nutrition}
    username: ${POSTGRES_USER:nutrition}
    password: ${POSTGRES_PASSWORD:local-development-only}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 26MB
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  cookie-secure: ${COOKIE_SECURE:false}
  demo-enabled: ${DEMO_ENABLED:false}
  demo-user-password: ${DEMO_USER_PASSWORD:}
  demo-admin-password: ${DEMO_ADMIN_PASSWORD:}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:}
  openai-embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  rag-minimum-similarity: ${RAG_MINIMUM_SIMILARITY:0.30}
  rag-storage: ${RAG_STORAGE:storage/rag}
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
