services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_MINIMUM_SIMILARITY: ${RAG_MINIMUM_SIMILARITY:-0.30}
      RAG_STORAGE: /app/storage/rag
    volumes:
      - rag_pdf_data:/app/storage/rag
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_ORIGIN: http://backend:8080
    depends_on:
      - backend
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
  rag_pdf_data:
